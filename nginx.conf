server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2 application/wasm;

    # Proper MIME types
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        model/gltf-binary glb;
        model/gltf+json gltf;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|glb|gltf)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
